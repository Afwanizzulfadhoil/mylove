<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Buat Kartu Ucapanmu Sendiri</title>
    <link rel="stylesheet" href="library/css/style.css">
    <!-- Load Supabase UMD CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="form-container">
        <h2>Buat Kartu Spesial</h2>
        <form id="cardForm">
            <label>Nama Penerima:</label>
            <input type="text" id="nama" required placeholder="Contoh: Cantikku">

            <label>Pesan / Kata-kata:</label>
            <textarea id="pesan" rows="4" required placeholder="Tulis pesan romantis di sini..."></textarea>

            <label>Link Foto (URL):</label>
            <input type="text" id="fotoUrl" required placeholder="Link foto (dari ImgBB / link publik)">

            <label>Pilih Lagu:</label>
            <select id="pilihanMusik">
                <option value="Music/Y2meta.app - Akhir Tak Bahagia - Misellia (Official Music Video) (128 kbps).mp3">Akhir Tak Bahagia - Misellia</option>
            </select>

            <button type="submit" id="submitBtn">Buat Link Kartu</button>
        </form>

        <div id="resultBox" style="display:none; margin-top: 20px;">
            <p>Yeay! Link kartu kamu sudah jadi:</p>
            <input type="text" id="generatedLink" readonly style="width: 100%;">
        </div>
    </div>

    <!-- Supabase JS Client via CDN -->
    <script src="library/js/cnd.js?v=2"></script>
    <script src="library/js/animation.js"></script>

</body>
</html>
